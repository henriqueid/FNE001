<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lastro · Gestão de Recebíveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F0F3F7; --line:#D8DEE7; --line-2:#E8ECF1;
  --ink:#172033; --ink-2:#364152; --muted:#667085;
  --accent:#173A5E; --accent-ink:#FFFFFF; --accent-soft:#E8EEF5;
  --ok:#287A55; --ok-soft:#E8F3ED; --warn:#946200; --warn-soft:#FAF1DC;
  --crit:#B23A3A; --crit-soft:#F8EAEA; --info:#35658F; --info-soft:#EAF0F6;
  --ret:#5E6572; --ret-soft:#EEF0F3;
  --nav:#102A43; --nav-ink:#D6E0EA; --nav-muted:#9FB0C1;
  --shadow:0 1px 2px rgba(16,42,67,.04),0 4px 14px rgba(16,42,67,.04);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px;line-height:1.25}
h2{font-size:16px}
h3{font-size:14px}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);border-right:1px solid var(--nav);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:26px;height:26px;border-radius:5px;background:#FFFFFF;position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--accent-ink);border-radius:2px}
.mark::before,.mark::after{background:var(--nav)}
.mark::before{top:9px}.mark::after{top:15px;right:10px}
.brand b{font-size:17px;letter-spacing:-.01em;color:#FFFFFF}
.brand span{display:block;font-size:11px;color:var(--nav-muted);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:6px;color:var(--nav-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#FFFFFF}
.nav button.on{background:rgba(255,255,255,.13);color:#FFFFFF;box-shadow:inset 3px 0 0 #8DB3D3}
.nav button:focus-visible{outline:2px solid #AFC9DF;outline-offset:1px}
.nav .count{font-size:11px;background:rgba(255,255,255,.12);color:#FFFFFF;border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.side-foot p{font-size:12px;color:var(--nav-muted)}

.main{padding-block:24px 64px;padding-inline:28px;min-width:0}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);margin-top:2px;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.kpi{gap:4px}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted)}

.btn{cursor:pointer;border:1px solid #C9D1DC;background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ret{background:var(--ret-soft);color:var(--ret)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.plain::before{display:none}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#536174;font-weight:600;background:#F3F5F8;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
tr.off td{opacity:.5}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[disabled],select[disabled]{background:var(--surface-2);color:var(--muted)}
textarea{font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical;white-space:pre;overflow:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
label.inline{display:flex;gap:8px;align-items:center;cursor:pointer}

.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.steps button{all:unset;cursor:pointer;flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink-2)}
.steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:11.5px;color:var(--ink-2)}
.steps button.on{border-color:var(--accent);color:var(--accent)}
.steps button.on b{background:var(--accent);color:var(--accent-ink)}
.steps button:focus-visible{outline:2px solid var(--accent)}

.opgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.resumo{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);gap:0;padding:0;overflow:hidden}
.resumo .rh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.resumo .blk{padding:10px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px}
.resumo .blk:last-child{border-bottom:none}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.kv.big{font-size:15px;font-weight:600}
.kv.big span:first-child{color:var(--ink)}
.liq{background:var(--accent-soft)}
.liq .kv.big span:last-child{color:var(--accent);font-size:19px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar i.b2{background:var(--warn);opacity:.9}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.tl li:last-child{border-bottom:none}
.tl li span{color:var(--muted);font-variant-numeric:tabular-nums}

pre.cnab{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;max-height:280px}
.note{background:var(--info-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft)}
.note.crit{background:var(--crit-soft)}
.note.ok{background:var(--ok-soft)}
.demo{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;flex:none}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tipo{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-align:left}
.tipo.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tipo b{font-size:14px}
.lock{font-size:11px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.lock::before{content:"";width:8px;height:7px;border:1.5px solid currentColor;border-radius:2px;margin-top:3px;box-shadow:0 -3px 0 -1.5px var(--surface),0 -4px 0 -1px currentColor}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:6px;padding:6px 8px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
details.card>summary{list-style:none;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .chev{display:inline-block;transition:transform .15s;color:var(--muted);margin-right:6px}
details.card[open]>summary .chev{transform:rotate(90deg)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg .btn{padding:4px 9px;font-size:12.5px}
.seg .btn.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.strip{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.strip .it{display:flex;flex-direction:column;gap:1px;min-width:0}
.strip .it b{font-size:15px;font-variant-numeric:tabular-nums}
.opbar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big-num{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--accent)}
tr.sub td{background:var(--surface-2)}
hr{border:none;border-top:1px solid var(--line-2);margin:0}

@media (max-width: 1080px){
  .opgrid{grid-template-columns:1fr}
  .resumo{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
}
@media (max-width: 860px){
  .app{display:block}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:10;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .main{padding-inline:16px}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width: 480px){ .g4{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark" aria-hidden="true"></div><div><b>Lastro</b><span>Gestão de recebíveis</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <p>Dados fictícios de exemplo. As alterações ficam salvas só neste navegador.</p>
      <div id="resetBox"></div>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ utilidades ============ */
const KEY='lastro-mvp-v2';
const T0=new Date(); T0.setHours(0,0,0,0);
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
const HOJE=iso(T0);
function add(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function dd(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function fd(s){if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fds(s){const p=s.split('-');return p[2]+'/'+p[1];}
function ddmmaa(s){const p=s.split('-');return p[2]+p[1]+p[0].slice(2);}
function fromDdmmaa(x){return '20'+x.slice(4,6)+'-'+x.slice(2,4)+'-'+x.slice(0,2);}
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=(v,d=2)=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const mil=v=>'R$ '+num(v/1000,0)+' mil';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const sum=(a,f)=>a.reduce((s,x)=>s+(typeof f==='function'?f(x):x[f]||0),0);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const dig=s=>String(s||'').replace(/\D/g,'');
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h>>>0);}
function cnpjDV(b){const w1=[5,4,3,2,9,8,7,6,5,4,3,2],w2=[6].concat(w1);const c=(x,w)=>{const r=x.split('').reduce((a,d,i)=>a+(+d)*w[i],0)%11;return r<2?0:11-r;};const d1=c(b,w1);const d2=c(b+d1,w2);return b+d1+d2;}
const fmtCnpj=d=>d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5');
const mkCnpj=b=>fmtCnpj(cnpjDV(b));
function cnpjOk(x){const d=dig(x);return d.length===14&&!/^(\d)\1+$/.test(d)&&cnpjDV(d.slice(0,12))===d;}
function mod10(x){let t=0,w=2;for(let i=x.length-1;i>=0;i--){let p=(+x[i])*w;t+=p>9?p-9:p;w=w===2?1:2;}const r=t%10;return r?10-r:0;}
function cmc7Info(c){const d=dig(c);if(d.length!==30)return {ok:false};const g1=d.slice(0,8),g2=d.slice(8,18),g3=d.slice(18);
  const ok=+g1[7]===mod10(g2)&&+g3[0]===mod10(g1.slice(0,7))&&+g3[11]===mod10(g3.slice(1,11));
  return {ok,banco:g1.slice(0,3),ag:g1.slice(3,7),comp:g2.slice(0,3),num:g2.slice(3,9),conta:g3.slice(1,11).replace(/^0+/,'')};}
function mkCmc7(banco,ag,comp,num,tip,conta){const g2=comp+num+tip,a=banco+ag,ct=conta.padStart(10,'0');return a+mod10(g2)+g2+mod10(a)+ct+mod10(ct);}
const fmtCmc7=c=>{const d=dig(c);return d.length===30?'<'+d.slice(0,8)+'<'+d.slice(8,18)+'>'+d.slice(18)+':':c;};
const brDate=x=>{const m=String(x||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:'';};
const brMoney=x=>{const v=parseFloat(String(x||'').replace(/\./g,'').replace(',','.'));return isFinite(v)?v:0;};
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve();const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
  const ld=u=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=u;sc.onload=ok;sc.onerror=()=>no(new Error('Não foi possível carregar o leitor de PDF'));document.head.appendChild(sc);});
  return ld(base+'pdf.min.js').then(()=>ld(base+'pdf.worker.min.js')).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';});}
async function pdfText(buf){await loadPdfJs();const doc=await window.pdfjsLib.getDocument({data:buf}).promise;let out='';for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();out+=tc.items.map(x=>x.str).join(' ')+'\n';}return out;}
const fmtCep=c=>dig(c).length===8?dig(c).replace(/(\d{5})(\d{3})/,'$1-$2'):(c||'—');

/* ============ regras fixas por tipo ============ */
const TIPOS={
  factoring:{nome:'Factoring',long:'Factoring (fomento mercantil)',iof:true,adv:true,pis:'Não cumulativo (9,25%)',ir:'Lucro real obrigatório',serv:'ISS sobre ad valorem e serviços; tomador retém IRRF, CSLL, PIS e COFINS sobre serviços, nunca sobre o deságio',padrao:'Deságio + ad valorem; cliente PJ; regresso por vício e, se contratado, por inadimplência',conc:null},

function precheckChq(t,d){const it=[],c=cmc7Info(t.cmc7),s=sacOf(t.sac);
  it.push(c.ok?{lvl:'ok',txt:`CMC7 válido · banco ${c.banco} · ag ${c.ag} · conta ${c.conta} · cheque ${c.num}`}:t.cmc7?{lvl:'crit',txt:'CMC7 inválido: dígitos verificadores não conferem'}:{lvl:'warn',txt:'Cheque digitado sem CMC7'});
  it.push(s.hist.recusas>1?{lvl:'warn',txt:'Consulta de cheques: emitente com devoluções anteriores'}:{lvl:'ok',txt:'Consulta de cheques: sem sustação ou devolução'});

  it.push(t.entrega?{lvl:'ok',txt:'CT-e de entrega vinculado'}:{lvl:'warn',txt:'Sem comprovante de entrega (CT-e ou canhoto)'});

  it.push(dup?{lvl:'crit',txt:`Duplicidade: NF ${t.nf} já operada na ${dup.op}`}:{lvl:'ok',txt:'Sem duplicidade na base'});
  const idade=dd(t.emissao,HOJE); if(idade>7) it.push({lvl:'warn',txt:`NF emitida há ${idade} dias`});

}
function sacAnalise(sid,d){
  const s=sacOf(sid),cli=cliOf(d.cli),it=[],e=elig();
  const imps=d.tits.filter(t=>t.sac===sid);
  const diffs=[];
  imps.forEach(t=>{
    if(t.imp.endereco&&t.imp.endereco!==s.endereco&&!diffs.find(x=>x.key==='endereco'))diffs.push({campo:'Endereço',key:'endereco',base:s.endereco,imp:t.imp.endereco});
    if(t.imp.cep&&t.imp.cep!==s.cep&&!diffs.find(x=>x.key==='cep'))diffs.push({campo:'CEP',key:'cep',base:s.cep,imp:t.imp.cep});
  });
  const pend=diffs.filter(x=>!d.dec[sid+x.key]);
  if(pend.length)it.push({lvl:'warn',txt:'Cadastro importado do XML diverge da base'});
  else if(Object.keys(d.dec).some(k=>k.startsWith(sid)))it.push({lvl:'ok',txt:'Divergências de cadastro tratadas pelo analista'});
  else it.push({lvl:'ok',txt:'Cadastro importado igual ao da base'});
  if(!s.cep)it.push({lvl:'warn',txt:'CEP ausente no cadastro: o boleto não poderá ser registrado'});
  if(norm(s.endereco)===norm(cli.endereco))it.push({lvl:'crit',txt:'Endereço igual ao do cliente (possível conluio)'});
  it.push(s.situacao==='Ativa'?{lvl:'ok',txt:`CNPJ ativo na Receita · ${s.ie}`}:{lvl:'crit',txt:'CNPJ irregular na Receita'});
  const meses=Math.floor(dd(s.abertura,HOJE)/30.4);
  it.push(meses<12?{lvl:'warn',txt:`Empresa aberta há ${meses} meses`}:{lvl:'ok',txt:`Empresa aberta há ${Math.floor(meses/12)} anos`});
  const sc=socioComum(s,cli);if(sc.length)it.push({lvl:'crit',txt:'Sócio em comum com o cliente: '+sc.join(', ')});
  if(s.bloq)it.push({lvl:'crit',txt:'Sacado bloqueado por recusa em checagem anterior'});
  it.push(s.score>=e.scoreMin?{lvl:'ok',txt:`Score de bureau ${s.score}`}:{lvl:'crit',txt:`Score ${s.score}, abaixo do mínimo de ${e.scoreMin}`});
  const tot=s.hist.pagos+s.hist.atrasos;
  if(!tot)it.push({lvl:'warn',txt:'Sem histórico de pagamentos na base'});
  else{const pa=s.hist.atrasos/tot*100;it.push({lvl:pa>10?'warn':'ok',txt:`${s.hist.pagos} títulos pagos e ${s.hist.atrasos} com atraso na base (${num(pa,1)}%)`});}
  if(s.hist.recusas)it.push({lvl:'warn',txt:`${s.hist.recusas} recusa(s) em checagens anteriores`});
  const exp=exposSac(sid)+sum(imps.filter(t=>t.incl),'valor');
  if(!s.limite)it.push({lvl:'crit',txt:'Sacado sem limite de crédito aprovado'});
  else it.push({lvl:exp>s.limite?'warn':'ok',txt:`Exposição de ${brl(exp)} para limite de ${brl(s.limite)}`});
  return {s,it,diffs,exp};
}
function share(sid,d){
  const baseAll=usoCli(d.cli)+sum(d.tits.filter(t=>t.incl),'valor');
  const sac=sum(S.titulos.filter(t=>t.cli===d.cli&&t.sac===sid&&aberto(t)),'valor')+sum(d.tits.filter(t=>t.incl&&t.sac===sid),'valor');
  return baseAll?sac/baseAll*100:0;
}
function hardBlock(t,d){const h=precheck(t,d).filter(i=>i.lvl==='crit'&&/cancelada|Duplicidade|não realizada|CMC7 inválido|Emitente da NF/.test(i.txt)).map(i=>i.txt);const s=sacOf(t.sac);if(s.situacao!=='Ativa')h.push('CNPJ do sacado irregular na Receita');return h;}
function socioComum(a,b){const n=new Set((b.qsa||[]).map(norm));return (a.qsa||[]).filter(x=>n.has(norm(x)));}
const gat=k=>S.cfg.gat[k]||GAT_DEF[k]||{};
function chkReq(t,d){if(t.tipo==='cheque')return {obrig:false,amostra:false,precisa:false,motivos:[],disp:'Cheque: validado pela consulta de cheques'};const s=sacOf(t.sac),r=[];
  const tot=s.hist.pagos+s.hist.atrasos;let disp=null;
  if(gat('dispManif').on&&t.manif==='confirmada')disp='NF confirmada pelo destinatário na SEFAZ';
  else if(gat('dispBom').on&&s.hist.pagos>=gat('dispBom').v&&tot&&s.hist.atrasos/tot<0.05&&!s.hist.recusas&&!s.bloq)disp=`Sacado bom pagador: ${s.hist.pagos} títulos pagos, ${num(s.hist.atrasos/tot*100,1)}% de atraso`;
  else if(gat('dispValor').on&&t.valor<gat('dispValor').v)disp='Valor abaixo de '+brl(gat('dispValor').v);
  if(disp)return {obrig:false,amostra:false,precisa:false,motivos:[],disp};
  if(gat('sacNovo').on&&!(s.hist.pagos+s.hist.atrasos))r.push('Sacado sem histórico na base');
  if(gat('valorChk').on&&t.valor>gat('valorChk').v)r.push('Valor acima de '+brl(gat('valorChk').v));
  if(gat('semManif').on&&t.manif==='sem')r.push('Sem manifestação do destinatário');
  if(gat('nfAntiga').on&&dd(t.emissao,HOJE)>gat('nfAntiga').v)r.push(`NF emitida há mais de ${gat('nfAntiga').v} dias`);
  const amostra=!r.length&&gat('amostra').on&&(parseInt(hash(t.nf+d.cli).slice(-2),10)<gat('amostra').v);
  return {obrig:r.length>0,amostra,precisa:r.length>0||amostra,motivos:r.length?r:(amostra?['Selecionado por amostragem']:[]),disp:r.length||amostra?null:'Fora da amostragem de checagem'};}
function chkStatus(c){if(c.dispM)return 'dispM';if(c.sem)return 'sem';if(!c.nf||!c.merc||!c.valor||!c.desac)return 'pendente';if(c.nf==='Não'||c.merc==='Não'||c.desac==='Sim')return 'recusado';if(c.valor==='Não')return 'ressalva';return 'confirmado';}
const CHK={pendente:['Pendente','warn'],confirmado:['Confirmado','ok'],ressalva:['Confirmado com ressalva','warn'],recusado:['Recusado pelo sacado','crit'],sem:['Sem contato','crit'],dispensada:['Dispensada pela política','neutral'],dispM:['Dispensada manualmente','neutral']};
function elegib(t,d){
  const e=elig(),mot=[];let lvl='ok';const up=l=>{if(LV[l]>LV[lvl])lvl=l;};

  const pc=worst(precheck(t,d)),sa=worst(sacAnalise(t.sac,d).it);
  if(pc!=='ok'){mot.push(pc==='crit'?'Reprovado na pré-checagem':'Alerta na pré-checagem');up(pc);}
  if(sa!=='ok'){mot.push(sa==='crit'?'Sacado reprovado na análise':'Alerta na análise do sacado');up(sa);}
  const n=dd(HOJE,t.venc);
  if(n<e.prazoMin||n>e.prazoMax){mot.push(`Prazo de ${n} dias fora da faixa ${e.prazoMin}–${e.prazoMax}`);up('crit');}
  if(t.valor<e.valorMin||t.valor>e.valorMax){mot.push('Valor fora da faixa aceita');up('crit');}
  const cc=share(t.sac,d);
  if(cc>e.concMax){mot.push(`Concentração de ${num(cc,1)}% no sacado (máx. ${e.concMax}%)`);up('warn');}
  if(S.cfg.tipo==='esc'&&!['MEI','ME','EPP'].includes(cliOf(d.cli).porte)){mot.push('ESC só atende MEI, ME ou EPP');up('crit');}
  const autoLvl=lvl,autoMot=mot.slice(),hard=hardBlock(t,d),ov=(d.ovr||{})[t.id]||(d.ovrSac||{})[t.sac];let manual=null;
  if(ov&&!(ov.dec==='ok'&&hard.length)){manual={...ov,nivel:(d.ovr||{})[t.id]?'título':'sacado'};mot.length=0;
    if(ov.dec==='ok'){lvl='warn';mot.push('Liberado manualmente ('+manual.nivel+'): '+ov.motivo);}else{lvl='crit';mot.push('Excluído manualmente ('+manual.nivel+'): '+ov.motivo);}}
  const baseLvl=lvl,rq=chkReq(t,d);let cs='dispensada';
  if(rq.precisa&&baseLvl!=='crit'){cs=chkStatus(t.chk);
    if(cs==='recusado'){mot.push('Recusado pelo sacado na checagem');up('crit');}
    else if(cs==='sem'){mot.push('Checagem sem contato com o sacado');up('warn');}
    else if(cs==='ressalva'){mot.push('Checagem com ressalva: valor ou vencimento divergente');up('warn');}}
  return {lvl,baseLvl,autoLvl,autoMot,manual,hard,mot,n,cc,rq,cs};
}

/* ============ fluxo de caixa ============ */
const CEN={conservador:{p:.78,r:.08,nome:'Conservador'},base:{p:.88,r:.07,nome:'Base'},otimista:{p:.95,r:.03,nome:'Otimista'}};
function iofDue(){const m={};S.iof.filter(x=>!x.pago).forEach(x=>{const d=new Date(x.d+'T00:00:00');const day=d.getDate();let end;if(day<=10)end=new Date(d.getFullYear(),d.getMonth(),10);else if(day<=20)end=new Date(d.getFullYear(),d.getMonth(),20);else end=new Date(d.getFullYear(),d.getMonth()+1,0);const due=add(iso(end),3);m[due]=(m[due]||0)+x.valor;});return m;}
function fluxo(cen){
  const c=CEN[cen],fl=S.cfg.float,days=[];let saldo=saldoSis();const iofm=iofDue();
  for(let i=0;i<=30;i++){
    const d=add(HOJE,i);const ent=[],sai=[];
    S.titulos.filter(t=>aberto(t)&&t.venc>=HOJE&&!t.cartorio).forEach(t=>{const due=add(t.venc,fl);if(due===d)ent.push(['Vencimentos da carteira (no prazo)',t.valor*c.p]);if(add(due,5)===d)ent.push(['Recuperação de atrasos (D+5)',t.valor*c.r]);});
    S.pagar.filter(p=>p.d===d).forEach(p=>sai.push([p.desc,p.valor]));
    S.pipeline.filter(p=>p.d===d).forEach(p=>sai.push([p.desc,p.valor]));
    if(iofm[d])sai.push(['Recolhimento de IOF (decêndio)',iofm[d]]);
    const e=sum(ent,x=>x[1]),s=sum(sai,x=>x[1]);
    if(i>0)saldo+=e-s;
    days.push({d,ent:r2(e),sai:r2(s),saldo:r2(saldo),entD:ent,saiD:sai});
  }
  return days;
}
function capacidade(){const f=fluxo('base');const m=Math.min(...f.slice(0,8).map(x=>x.saldo));return Math.max(0,r2(m-S.cfg.saldoMin));}

/* ============ cálculo da operação ============ */
function calc(d){
  const c=S.cfg,tp=tipo(),i=d.taxa/100;
  const rows=d.tits.map(t=>({t,el:elegib(t,d)}));
  const inc=rows.filter(r=>r.t.incl&&r.el.lvl!=='crit');
  const VF=sum(inc,r=>r.t.valor);
  inc.forEach(r=>{const n=Math.max(dd(HOJE,r.t.venc)+c.float,c.prazoMin);r.n=n;
    r.des=r2(d.metodo==='simples'?r.t.valor*i*n/30:r.t.valor*(1-Math.pow(1+i,-n/30)));
    r.adv=r2(tp.adv?r.t.valor*c.adv/100:0);r.tar=c.tarTit;
    const base=r.t.valor-r.des;r.iof=r2(tp.iof?base*(0.000041*Math.min(n,365)+0.0038):0);});
  const tarOp=inc.length?c.tarOp:0,esp=sum(d.esp,'valor');
  const peso=d.rateio==='valor'?VF:sum(inc,r=>r.t.valor*r.n);
  inc.forEach(r=>{const w=d.rateio==='valor'?r.t.valor:r.t.valor*r.n;r.rat=peso?(tarOp+esp)*w/peso:0;r.custo=r.des+r.adv+r.tar+r.iof+r.rat;r.liq=r.t.valor-r.custo;r.allin=(Math.pow(r.t.valor/r.liq,30/r.n)-1)*100;});
  const des=r2(sum(inc,'des')),adv=r2(sum(inc,'adv')),iof=r2(sum(inc,'iof')),tarT=r2(sum(inc,'tar'));
  const tarifas=r2(tarT+tarOp+esp);
  const liqAntes=r2(VF-des-adv-iof-tarifas);
  let lo=0,hi=1;for(let k=0;k<70&&inc.length;k++){const m=(lo+hi)/2;const pv=sum(inc,r=>r.t.valor/Math.pow(1+m,r.n/30));if(pv>liqAntes)lo=m;else hi=m;}
  const ef=inc.length?lo*100:0,efAno=inc.length?(Math.pow(1+lo,12)-1)*100:0;
  const pm=VF?sum(inc,r=>r.t.valor*r.n)/VF:0;
  const venc=S.titulos.filter(t=>t.cli===d.cli&&vencido(t)).sort((a,b)=>a.venc<b.venc?-1:1);
  const cgs=cgSaldo(d.cli);const semL=inc.filter(r=>!r.t.entrega);
  const cand=[
    {k:'recompra',nome:'Recompra de títulos vencidos',valor:sum(venc,'valor'),det:venc.map(t=>`NF ${t.nf} · ${sacOf(t.sac).nome} · venceu em ${fd(t.venc)} · ${brl(t.valor)}`),uso:'Quita a recompra na hora'},
    {k:'tarifas',nome:'Tarifas e encargos em aberto',valor:cgs<0?-cgs:0,det:cgs<0?['Saldo devedor na conta gráfica do cliente']:[],uso:'Quita o saldo devedor'},
    {k:'lastro',nome:'Pendência de lastro',valor:sum(semL,r=>r.t.valor),det:semL.map(r=>`NF ${r.t.nf} sem comprovante de entrega`),uso:'Libera quando o lastro for regularizado'},
    {k:'garantia',nome:`Garantia de ${num(d.garPct,1)}% do valor de face`,valor:r2(VF*d.garPct/100),det:[],uso:'Devolvida na liquidação dos títulos'}];
  d.livres.forEach((l,ix)=>cand.push({k:'livre',ix,nome:'Manual: '+l.desc,valor:l.valor,det:[l.motivo],uso:'Uso definido pela operadora'}));
  let disp=liqAntes;
  cand.forEach(x=>{x.on=x.k==='livre'?true:!!d.ret[x.k];x.aplic=x.on?r2(Math.min(x.valor,Math.max(disp,0))):0;disp-=x.aplic;x.parcial=x.on&&x.aplic<x.valor-0.004;});
  const ret=r2(sum(cand,'aplic'));const liq=r2(liqAntes-ret);
  const cli=cliOf(d.cli),usoA=usoCli(d.cli),usoD=usoA+VF;
  const concMax=Math.max(0,...[...new Set(inc.map(r=>r.t.sac))].map(sid=>share(sid,d)));
  const ress=inc.some(r=>r.el.lvl==='warn');const cap=capacidade();
  const G=[];
  if(gat('valorOp').on&&VF>gat('valorOp').v)G.push({lvl:'crit',txt:`Operação de ${brl(VF)}, acima de ${brl(gat('valorOp').v)}`,ef:'Exige aprovação do gerente'});
  if(gat('limite').on&&usoD>cli.limite*gat('limite').v/100)G.push({lvl:'crit',txt:`Uso do limite do cliente vai a ${num(usoD/cli.limite*100,0)}%`,ef:'Exige aprovação do gerente'});
  const man=rows.filter(r=>r.el.manual&&r.el.manual.dec==='ok'&&r.t.incl);
  if(gat('manualGer').on&&man.length)G.push({lvl:'crit',txt:`${man.length} título(s) liberado(s) manualmente contra a política`,ef:'Exige aprovação do gerente'});
  const velhos=venc.filter(t=>dd(t.venc,HOJE)>gat('vencCli').v);
  if(gat('vencCli').on&&velhos.length)G.push(d.ret.recompra?{lvl:'ok',txt:`${velhos.length} título(s) vencido(s) há mais de ${gat('vencCli').v} dias`,ef:'Liberado porque a recompra está sendo retida'}:{lvl:'block',txt:`${velhos.length} título(s) vencido(s) há mais de ${gat('vencCli').v} dias`,ef:'Bloqueia a operação até reter a recompra'});
  const chkRows=rows.filter(r=>r.el.rq.precisa&&r.t.incl&&r.el.baseLvl!=='crit');
  if(chkRows.length)G.push({lvl:'ok',txt:`${chkRows.length} título(s) checado(s) com o sacado (${chkRows.filter(r=>r.el.rq.obrig).length} obrigatória, ${chkRows.filter(r=>!r.el.rq.obrig).length} por amostragem)`,ef:'Resultado considerado na decisão'});
  const pend=chkRows.filter(r=>r.el.cs==='pendente');
  if(pend.length)G.push({lvl:'block',txt:`${pend.length} checagem(ns) pendente(s)`,ef:'Conclua a checagem para efetivar'});
  const dm=chkRows.filter(r=>r.el.cs==='dispM'&&r.el.rq.obrig);
  if(gat('dispManGer').on&&dm.length)G.push({lvl:'crit',txt:`${dm.length} checagem(ns) obrigatória(s) dispensada(s) manualmente`,ef:'Exige aprovação do gerente'});
  const dpol=rows.filter(r=>r.t.incl&&r.el.baseLvl!=='crit'&&!r.el.rq.precisa&&r.t.tipo!=='cheque'&&r.el.rq.disp!=='Fora da amostragem de checagem');
  if(dpol.length)G.push({lvl:'ok',txt:`${dpol.length} checagem(ns) dispensada(s) pela política`,ef:'Sem ação'});
  const semC=inc.filter(r=>r.el.rq.obrig&&r.el.cs==='sem');
  if(gat('semContato').on&&semC.length)G.push({lvl:'crit',txt:`${semC.length} checagem(ns) obrigatória(s) sem contato`,ef:'Exige aprovação do gerente'});
  const recus=rows.filter(r=>r.el.cs==='recusado');
  if(recus.length)G.push({lvl:'warn',txt:`${recus.length} título(s) recusado(s) pelo sacado`,ef:gat('bloqSac').on?'Título excluído e sacado bloqueado na base ao efetivar':'Título excluído'});
  if(liq>cap)G.push({lvl:'crit',txt:`Liberação de ${brl(liq)} acima da capacidade de caixa`,ef:'Exige aprovação do gerente'});
  let faixa='verde',motivo='Todos os títulos dentro da política';
  if(ress){faixa='amarela';motivo='Há títulos com ressalva';}
  const gc=G.find(g=>g.lvl==='crit');if(gc){faixa='laranja';motivo=gc.txt;}
  const gb=G.find(g=>g.lvl==='block');if(gb){faixa='vermelha';motivo=gb.txt;}
  if(!inc.length){faixa='vazia';motivo='Nenhum título incluído';}
  const nChk=chkRows.length,okChk=chkRows.filter(r=>['confirmado','ressalva','dispM'].includes(r.el.cs)).length;
  return {rows,inc,VF,des,adv,iof,tarT,tarOp,esp,tarifas,liqAntes,ef,efAno,pm,cand,ret,liq,usoA,usoD,cli,concMax,faixa,motivo,cap,venc,semL,G,nChk,okChk,recus};
}
const FAIXA={verde:['Verde · aprovação automática','ok'],amarela:['Amarela · analista','warn'],laranja:['Laranja · gerente','crit'],vermelha:['Vermelha · bloqueada','crit'],vazia:['Sem títulos','neutral']};
function gatCarteira(){const acts=[];

    else if(gat('lastroPrazo').on&&!t.entrega&&dd(t.compra||HOJE,HOJE)>gat('lastroPrazo').v)acts.push({t,tipo:'recompra',txt:`Recompra da NF ${t.nf} · lastro pendente há ${dd(t.compra,HOJE)} dias`});
    else if(gat('protesto').on&&atraso>gat('protesto').v&&!t.cartorio&&t.reg==='registrado'&&!S.instr.some(i=>i.tit===t.id&&i.cod==='09'))acts.push({t,tipo:'protesto',txt:`Protesto automático da NF ${t.nf} · ${atraso} dias de atraso`});});
  return acts;}

function ofxOf(lines){const acc=dig(S.cfg.conta).slice(-6)||'000000';const dt=x=>x.replace(/-/g,'')+'120000[-3:BRT]';
  const bal=r2(S.abertura+sum(S.bank.lines,'valor'));const d0=lines.length?lines[0].d:HOJE;
  return ['OFXHEADER:100','DATA:OFXSGML','VERSION:102','SECURITY:NONE','ENCODING:USASCII','CHARSET:1252','COMPRESSION:NONE','OLDFILEUID:NONE','NEWFILEUID:NONE','',
  '<OFX>','<SIGNONMSGSRSV1><SONRS><STATUS><CODE>0<SEVERITY>INFO</STATUS><DTSERVER>'+dt(HOJE)+'<LANGUAGE>POR</SONRS></SIGNONMSGSRSV1>',
  '<BANKMSGSRSV1><STMTTRNRS><TRNUID>1<STATUS><CODE>0<SEVERITY>INFO</STATUS><STMTRS><CURDEF>BRL',
  '<BANKACCTFROM><BANKID>0999<ACCTID>'+acc+'<ACCTTYPE>CHECKING</BANKACCTFROM>',
  '<BANKTRANLIST><DTSTART>'+dt(d0)+'<DTEND>'+dt(HOJE)]
  .concat(lines.map(l=>'<STMTTRN><TRNTYPE>'+(l.valor<0?'DEBIT':'CREDIT')+'<DTPOSTED>'+dt(l.d)+'<TRNAMT>'+l.valor.toFixed(2)+'<FITID>'+l.fitid+'<MEMO>'+l.desc+'</STMTTRN>'))
  .concat(['</BANKTRANLIST>','<LEDGERBAL><BALAMT>'+bal.toFixed(2)+'<DTASOF>'+dt(HOJE)+'</LEDGERBAL>','</STMTRS></STMTTRNRS></BANKMSGSRSV1>','</OFX>']).join('\n');}
function parseOfx(txt){const g=(b,t)=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():'';};
  const tr=txt.split(/<STMTTRN>/i).slice(1).map(b=>{const dp=g(b,'DTPOSTED');return {fitid:g(b,'FITID'),d:dp.length>=8?dp.slice(0,4)+'-'+dp.slice(4,6)+'-'+dp.slice(6,8):'',valor:parseFloat(g(b,'TRNAMT').replace(',','.')),desc:g(b,'MEMO')||g(b,'NAME')};}).filter(x=>x.fitid&&x.d&&isFinite(x.valor));
  const bm=txt.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]*)/i);return {tr,bal:bm?parseFloat(bm[1].replace(',','.')):null};}

function stepEntrada(d,k){const c=cliOf(d.cli),u=usoCli(c.id),v=S.titulos.filter(t=>t.cli===c.id&&vencido(t)),venceCM=c.contratoVig&&dd(HOJE,c.contratoVig)<60;

const SPEC_REM=[['tipo',1,'n'],['insc',2,'n'],['cnpj',14,'n'],['conv',20,'a'],['nosso',12,'n'],['ocor',2,'n'],['doc',10,'a'],['venc',6,'n'],['valor',13,'n'],['emis',6,'n'],['inscSac',2,'n'],['cnpjSac',14,'n'],['nomeSac',40,'a'],['endSac',40,'a'],['cepSac',8,'n']];
const SPEC_RET=[['tipo',1,'n'],['insc',2,'n'],['cnpj',14,'n'],['conv',20,'a'],['nosso',12,'n'],['ocor',2,'n'],['data',6,'n'],['doc',10,'a'],['venc',6,'n'],['valor',13,'n'],['pago',13,'n'],['tarifa',13,'n'],['motivo',20,'a']];
const fld=(v,len,t)=>t==='n'?dig(v).padStart(len,'0').slice(-len):norm(v).padEnd(len,' ').slice(0,len);
function lineOf(spec,o,seq){let s=spec.map(([k,l,t])=>fld(o[k]??'',l,t)).join('');return s.padEnd(394,' ')+String(seq).padStart(6,'0');}
function headerOf(tipoArq,seqArq){const c=S.cfg;let s='0'+(tipoArq==='R'?'1REMESSA':'2RETORNO')+'01'+fld('COBRANCA',15,'a')+fld(c.convenio,20,'a')+fld(c.razao,30,'a')+'000'+fld('BANCO EXEMPLO',15,'a')+ddmmaa(HOJE)+String(seqArq).padStart(7,'0');return s.padEnd(394,' ')+'000001';}
const trailerOf=seq=>'9'.padEnd(394,' ')+String(seq).padStart(6,'0');
function parseLine(spec,l){let p=0;const o={};spec.forEach(([k,len])=>{o[k]=l.slice(p,p+len);p+=len;});return o;}
function remessaItens(){
  const it=[];
  S.titulos.filter(t=>t.reg==='pendente').forEach(t=>it.push({t,ocor:'01'}));
  S.instr.filter(x=>!x.sent).forEach(x=>{const t=S.titulos.find(y=>y.id===x.tit);if(t&&t.reg==='registrado')it.push({t,ocor:x.cod,ins:x});});
  it.forEach(x=>{const s=sacOf(x.t.sac),e=[];if(dig(s.cep).length!==8)e.push('CEP do sacado ausente ou inválido');if(dig(s.cnpj).length!==14)e.push('CNPJ do sacado inválido');if(x.ocor==='01'&&x.t.venc<HOJE)e.push('Vencimento no passado');x.err=e;});
  return it;
}
V.cobranca=()=>{

    ${UI.cnabTxt?`<span class="label">Arquivo gerado</span><pre class="cnab" id="cnabOut">${esc(UI.cnabTxt)}</pre><div class="row"><button class="btn sm" data-act="copy" data-v="cnabOut">Copiar arquivo</button><span class="small muted">Envio por download, VAN ou API do banco na versão final.</span></div>`:''}

function finFluxo(){
  const f=fluxo(UI.cen),min=S.cfg.saldoMin;
  const W=720,H=240,pl=70,pr=16,pt=16,pb=28;
  const vals=f.map(x=>x.saldo).concat([min]);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.1||50000;lo=Math.max(0,lo-pad);hi=hi+pad;
  const step=Math.pow(10,Math.floor(Math.log10((hi-lo)/4)));const tk=[1,2,2.5,5,10].map(m=>m*step).find(s=>(hi-lo)/s<=5)||step*10;const t0=Math.ceil(lo/tk)*tk;const ticks=[];for(let v=t0;v<=hi;v+=tk)ticks.push(v);
  const X=i=>pl+i*(W-pl-pr)/30,Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=f.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.saldo).toFixed(1)).join(' ');

function finConc(){

  const R=UI.ofxRes;

    <p class="small muted">Exporte o extrato em OFX no internet banking e envie o arquivo. Lançamentos já importados são ignorados pelo identificador do banco (FITID). Na versão final, o extrato também chega sozinho por API ou Open Finance.</p>
    <div class="row"><input type="file" id="ofxFile" accept=".ofx,.OFX,.txt" aria-label="Arquivo OFX"><button class="btn sm" data-act="ofxDemo">Gerar OFX de exemplo do banco</button></div>
    <label class="field"><span>Conteúdo do arquivo</span><textarea id="ofxTxt" rows="6" placeholder="Envie um arquivo .ofx ou cole o conteúdo aqui">${esc(UI.ofxTxt)}</textarea></label>

  return ofx+`<div class="grid g4"><div class="card kpi"><span class="label">Saldo no sistema</span><span class="v">${brl(saldoSis())}</span><span class="s">${S.mov.length} movimentos</span></div>

  <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Extrato</th><th class="r">Valor</th><th>Situação</th><th>Sistema</th></tr></thead><tbody>
  ${ext.map(x=>{const m=S.mov.find(y=>y.id===x.match);return `<tr><td>${fd(x.d)}</td><td class="mono">${esc(x.desc)}</td><td class="r">${brl(x.valor)}</td><td>${x.conc?pill(x.auto?'Conciliado automático':'Conciliado','ok'):x.valor>0?pill('Crédito a identificar','warn'):pill('Débito não reconhecido','crit')}</td><td class="small">${m?esc(m.desc):x.conc?esc(x.nota||''):x.valor>0?`<button class="btn sm" data-act="idCred" data-v="${x.id}">Identificar</button>`:`<button class="btn sm" data-act="despBanc" data-v="${x.id}">Lançar como despesa bancária</button>`}</td></tr>`;}).join('')}
  </tbody></table></div>
  ${idc?(()=>{const cands=S.titulos.filter(t=>aberto(t)&&Math.abs(t.valor-idc.valor)<0.01);return `<div class="card"><div class="card-h"><h2>Identificar crédito de ${brl(idc.valor)}</h2><button class="btn sm ghost" data-act="idCred" data-v="">Fechar</button></div><p class="small muted mono">${esc(idc.desc)}</p>

    <p class="small muted">A busca usa valor e o CNPJ do pagador informado no Pix. Ao baixar, o sistema pede a baixa do boleto ao banco na próxima remessa.</p></div>`;})():''}

  ['Bancos (1.1.1) × saldo financeiro do sistema',r2(b['1.1.1']),saldoSis()],
  ['Clientes – conta gráfica (1.1.3) × saldo devedor dos clientes',r2(b['1.1.3']),r2(-sum(S.clientes,c=>cgSaldo(c.id)))],
  ['Retenções de clientes (2.1.2) × saldo das retenções',r2(-b['2.1.2']),r2(sum(S.ret,'saldo'))]];}

  ${S.ctb.slice().reverse().map(l=>l.p.map((p,i)=>`<tr>${i===0?`<td rowspan="${l.p.length}">${fd(l.d)}</td><td rowspan="${l.p.length}">${esc(l.hist)}</td>`:''}<td><span class="mono">${p.c}</span> ${CONTAS[p.c]}</td><td class="r">${p.dc==='D'?brl(p.v):''}</td><td class="r">${p.dc==='C'?brl(p.v):''}</td>${i===0?`<td rowspan="${l.p.length}">${l.exp?pill('Sim','ok'):pill('Não','warn')}</td>`:''}</tr>`).join('')).join('')}

function cadAlerts(F,kind){const a=[];if(!F.razao)return a;
  if(F.situacao&&F.situacao!=='Ativa')a.push(['crit',`Situação cadastral ${F.situacao}: não pode operar`]);
  if(F.abertura){const m=Math.floor(dd(F.abertura,HOJE)/30.4);if(m<12)a.push(['warn',`Empresa aberta há ${m} meses`]);}
  const q={qsa:F.qsaTxt.split('\n').map(x=>x.trim()).filter(Boolean)};
  (kind==='sacado'?S.clientes:S.sacados).forEach(o=>{const sc=socioComum(q,o);if(sc.length)a.push(['crit',`Sócio em comum com ${kind==='sacado'?'o cedente':'o sacado'} ${o.nome}: ${sc.join(', ')}`]);});
  if(kind==='cedente'&&S.cfg.tipo==='esc'&&!['MEI','ME','EPP'].includes(F.porte))a.push(['crit','ESC só pode atender MEI, ME ou EPP']);
  if(kind==='cedente'){const f=Object.entries(DOCS).filter(([k])=>!F.docs[k]).map(x=>x[1]);if(f.length)a.push(['warn','Documentos pendentes: '+f.join(', ')]);if(!(F.contasFav||[]).some(x=>x.status==='validada'))a.push(['crit','Nenhuma conta favorecida validada para liberação']);if(!(F.assinantes||[]).some(x=>x.status==='ativo'))a.push(['crit','Nenhum assinante ativo para a formalização']);}

      ${(F.assinantes||[]).length?`<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Cargo</th><th>Contato</th><th>Regra de assinatura</th><th>Validade</th><th>Status</th><th></th></tr></thead><tbody>${F.assinantes.map((x,i)=>`<tr><td><input type="text" data-bind="ui.form.f.assinantes.${i}.nome" value="${esc(x.nome)}"></td><td><input type="text" data-bind="ui.form.f.assinantes.${i}.cpf" value="${esc(x.cpf)}" placeholder="000.000.000-00"></td><td><input type="text" data-bind="ui.form.f.assinantes.${i}.cargo" value="${esc(x.cargo)}" placeholder="Administrador"></td><td><input type="text" data-bind="ui.form.f.assinantes.${i}.email" value="${esc(x.email)}" placeholder="E-mail"><input type="text" data-bind="ui.form.f.assinantes.${i}.telefone" value="${esc(x.telefone)}" placeholder="Telefone" style="margin-top:5px"></td><td><select data-bind="ui.form.f.assinantes.${i}.regra"><option ${x.regra==='Assina isoladamente'?'selected':''}>Assina isoladamente</option><option ${x.regra==='Em conjunto'?'selected':''}>Em conjunto</option><option ${x.regra==='Procurador'?'selected':''}>Procurador</option><option ${x.regra==='Avalista'?'selected':''}>Avalista</option></select></td><td><input type="date" data-bind="ui.form.f.assinantes.${i}.validade" value="${esc(x.validade)}"></td><td><select data-bind="ui.form.f.assinantes.${i}.status"><option value="ativo" ${x.status==='ativo'?'selected':''}>Ativo</option><option value="pendente" ${x.status==='pendente'?'selected':''}>Pendente</option><option value="inativo" ${x.status==='inativo'?'selected':''}>Inativo</option></select></td><td><button class="btn sm ghost danger" data-act="rmAssinante" data-v="${x.id}">Remover</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum assinante cadastrado.</div>'}</div>

V.cadastros=()=>UI.form?cadForm():UI.sacView&&sacOf(UI.sacView)?sacCarteira(UI.sacView,null,null):`<div class="head"><div><h1>Cadastros</h1><p>Cedentes e sacados, com limites, exposição e histórico na base. Clique em um cadastro para editar.</p></div><div class="row"><button class="btn" data-act="novoCad" data-v="sacado">Novo sacado</button><button class="btn primary" data-act="novoCad" data-v="cedente">Novo cedente</button></div></div>

  ${UI.cad==='clientes'?`<div class="tbl-wrap"><table><thead><tr><th>Cedente</th><th>CNPJ</th><th>Porte</th><th>Contrato</th><th class="r">Taxa</th><th class="r">Limite</th><th class="r">Em aberto</th><th class="r">Conta gráfica</th><th>Prontidão operacional</th></tr></thead><tbody>
  ${S.clientes.map(c=>{const pct=cadPercent(c),pend=cadChecklist(c).filter(x=>!x.ok);return `<tr class="click" data-act="editCad" data-v="c:${c.id}"><td>${esc(c.nome)}<br><span class="small muted">${esc(c.endereco)} · ${esc(c.cidade)}</span></td><td class="mono">${c.cnpj}</td><td>${c.porte}</td><td class="small">${esc(c.contrato||'—')}${c.contratoVig?'<br><span class="muted">até '+fd(c.contratoVig)+'</span>':''}</td><td class="r">${num(c.taxa)}%</td><td class="r">${brl(c.limite)}</td><td class="r">${brl(usoCli(c.id))}</td><td class="r">${brl(cgSaldo(c.id))}</td><td>${pill(pct+'% completo',pct===100?'ok':pct>=60?'warn':'crit')}<div class="small muted" style="margin-top:4px">${pend.length?esc(pend[0].t):'Apto para operar'}</div></td></tr>`;}).join('')}</tbody></table></div>`:
  `<div class="tbl-wrap"><table><thead><tr><th>Sacado</th><th>CNPJ</th><th>CEP</th><th class="r">Score</th><th class="r">Pagos / atrasos</th><th class="r">Limite</th><th class="r">Exposição</th><th>Alertas</th><th></th></tr></thead><tbody>
  ${S.sacados.map(s=>{const al=[];if(s.bloq)al.push(pill('Bloqueado','crit'));if(S.clientes.some(c=>socioComum(s,c).length))al.push(pill('Sócio em comum','crit'));if(s.score<S.cfg.elig.scoreMin)al.push(pill('Score baixo','warn'));if(!s.cep)al.push(pill('Sem CEP','warn'));if(!s.limite)al.push(pill('Sem limite','crit'));return `<tr class="click" data-act="editCad" data-v="s:${s.id}"><td>${esc(s.nome)}<br><span class="small muted">${esc(s.endereco)} · ${esc(s.cidade)}</span></td><td class="mono">${s.cnpj}</td><td class="mono">${fmtCep(s.cep)}</td><td class="r">${s.score||'—'}</td><td class="r">${s.hist.pagos} / ${s.hist.atrasos}</td><td class="r">${brl(s.limite)}</td><td class="r">${brl(exposSac(s.id))}</td><td>${al.join(' ')||pill('Sem alertas','ok')}</td><td><button class="btn sm" data-act="sacView" data-v="${s.id}">Carteira</button></td></tr>`;}).join('')}</tbody></table></div>`}`;

/* ---------- Configuração ---------- */
V.config=()=>{
  const c=S.cfg,tp=tipo(),ck=checklist();
  const inp=(label,key,extra)=>`<label class="field"><span>${label}</span><input type="text" id="cfg-${key}" data-bind="cfg.${key}" value="${esc(c[key])}" ${extra||''}></label>`;
  const nin=(label,key,dis,path)=>`<label class="field"><span>${label}</span><input type="number" step="0.01" id="cfg-${key}" data-bind="${path||'cfg.'+key}" data-num value="${path?c.elig[key]:c[key]}" ${dis?'disabled':''}></label>`;
  return `<div class="head"><div><h1>Configuração da operadora</h1><p>O tipo de empresa trava tributos e o padrão da operação. O resto são opções. A empresa só opera com todos os itens obrigatórios em verde.</p></div>${pill(ck.filter(x=>x.ok).length+' de '+ck.length+' itens obrigatórios',cfgOk()?'ok':'crit')}</div>
  <div class="grid g4">${Object.entries(TIPOS).map(([k,t])=>`<button class="tipo ${c.tipo===k?'on':''}" data-act="tipo" data-v="${k}"><b>${t.nome}</b><span class="small muted">${t.long}</span></button>`).join('')}</div>
  <div class="split">
    <div class="card"><div class="card-h"><h2>Regras fixas · ${tp.long}</h2><span class="lock">Travado pelo tipo</span></div>
      <div class="kv"><span>IOF na operação</span><span>${tp.iof?'Incide: 0,0041% ao dia + 0,38%':'Não incide'}</span></div>
      <div class="kv"><span>Ad valorem</span><span>${tp.adv?'Permitido':'Não se aplica'}</span></div>
      <div class="kv"><span>PIS/COFINS</span><span>${tp.pis}</span></div>
      <div class="kv"><span>IRPJ/CSLL</span><span>${tp.ir}</span></div>
      <div class="kv"><span>Serviços e retenções</span><span>${tp.serv}</span></div>
      <div class="kv"><span>Padrão da operação</span><span>${tp.padrao}</span></div>
      ${tp.conc?`<div class="kv"><span>Concentração máxima</span><span>${tp.conc}% por sacado (regulamento)</span></div>`:''}
      <p class="small muted">Padrões iniciais para validar com o contador. As alíquotas ficam em tabela com data de vigência.</p></div>
    <div class="card"><div class="card-h"><h2>Itens obrigatórios</h2></div>
      <ul class="checks">${ck.map(x=>`<li><span class="dot ${x.ok?'ok':'crit'}"></span><span style="flex:1">${x.t}</span>${['calendario','aprovador','plano'].includes(x.k)?`<input type="checkbox" id="ck-${x.k}" data-bind="cfg.${x.k}" ${c[x.k]?'checked':''} aria-label="${x.t}">`:''}</li>`).join('')}</ul></div>
  </div>
  <div class="card"><h2>Empresa e bancos</h2><div class="fgrid">${inp('Razão social','razao')}${inp('CNPJ','cnpj')}${inp('Município','municipio')}${inp('ISS do município (%)','iss')}${inp('Conta de liberação','conta')}${inp('Convênio de cobrança','convenio')}</div></div>
  <div class="card"><h2>Preço, tarifas e caixa</h2><div class="fgrid">
    <label class="field"><span>Método padrão</span><select id="cfg-metodo" data-bind="cfg.metodo"><option value="simples" ${c.metodo==='simples'?'selected':''}>Deságio simples</option><option value="composto" ${c.metodo==='composto'?'selected':''}>Deságio composto</option></select></label>
    ${nin('Taxa padrão (% a.m.)','taxa')}${nin('Float (dias)','float')}${nin('Prazo mínimo de cálculo (dias)','prazoMin')}${nin('Ad valorem (%)','adv',!tp.adv)}${nin('Tarifa por operação (R$)','tarOp')}${nin('Tarifa por título (R$)','tarTit')}${nin('Retenção de garantia padrão (%)','garantia')}${nin('Saldo mínimo de caixa (R$)','saldoMin')}</div></div>
  <div class="card"><div class="card-h"><h2>Gatilhos</h2><span class="muted small">Regras que disparam sozinhas na operação e na carteira</span></div>
    ${[['op','Na operação'],['chk','Checagem'],['cart','Na carteira']].map(([g,t])=>`<span class="label">${t}</span>${GAT_META.filter(m=>m.g===g).map(m=>{const G=c.gat[m.k]||(c.gat[m.k]={...GAT_DEF[m.k]});return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line-2);padding-bottom:8px"><label class="inline"><input type="checkbox" id="g-${m.k}-on" data-bind="gat" data-k="${m.k}" data-f="on" ${G.on?'checked':''}> <span class="${G.on?'':'muted'}">${esc(m.t(G.v))}</span></label>${m.u?`<span class="row" style="flex-wrap:nowrap"><input type="number" id="g-${m.k}-v" data-bind="gat" data-k="${m.k}" data-f="v" data-num value="${G.v}" style="width:120px" ${G.on?'':'disabled'} aria-label="Parâmetro"><span class="small muted">${m.u}</span></span>`:''}</div>`;}).join('')}`).join('')}</div>
  <div class="card"><h2>Elegibilidade padrão</h2><div class="fgrid">${nin('Prazo mínimo (dias)','prazoMin',false,'cfg.elig.prazoMin').replace('cfg-prazoMin','el-prazoMin')}${nin('Prazo máximo (dias)','prazoMax',false,'cfg.elig.prazoMax').replace('cfg-prazoMax','el-prazoMax')}${nin('Valor mínimo (R$)','valorMin',false,'cfg.elig.valorMin').replace('cfg-valorMin','el-valorMin')}${nin('Valor máximo (R$)','valorMax',false,'cfg.elig.valorMax').replace('cfg-valorMax','el-valorMax')}${nin('Score mínimo do sacado','scoreMin',false,'cfg.elig.scoreMin').replace('cfg-scoreMin','el-scoreMin')}${nin('Concentração máxima (%)','concMax',false,'cfg.elig.concMax').replace('cfg-concMax','el-concMax')}</div></div>`;
};

/* ============ ações ============ */
const A={};
A.go=v=>{UI.view=v;UI.sacView=null;if(v==='operacao')UI.opMode='list';window.scrollTo(0,0);};
A.sacView=v=>{UI.sacView=v||null;window.scrollTo(0,0);};
A.resetAsk=()=>UI.resetAsk=true; A.resetNo=()=>UI.resetAsk=false;
A.reset=()=>{S=seed();UI.resetAsk=false;UI.cnabTxt='';UI.retTxt='';UI.expTxt='';UI.sel=null;UI.titOp='';toast('Dados de exemplo restaurados');};
A.opNew=()=>{if(S.draft){S.drafts.push(S.draft);S.draft=null;}UI.opMode='new';window.scrollTo(0,0);};
A.backOps=()=>{UI.opMode='list';window.scrollTo(0,0);};
A.resumeOp=prop=>{if(!S.draft||S.draft.info.proposta!==prop){const i=S.drafts.findIndex(x=>x.info.proposta===prop);if(i>=0){if(S.draft)S.drafts.push(S.draft);S.draft=S.drafts.splice(i,1)[0];}}UI.opMode='detail';window.scrollTo(0,0);};
A.novaOp=cid=>{UI.addOpen=false;const c=cliOf(cid),cf=(c.contasFav||[]).find(x=>x.status==='validada'&&x.principal)||(c.contasFav||[]).find(x=>x.status==='validada');S.draft={cli:cid,tits:[],esp:[],livres:[],ret:{recompra:true,tarifas:true,lastro:true,garantia:true},garPct:S.cfg.garantia,metodo:S.cfg.metodo,taxa:c.taxa,rateio:'valor',allin:true,regresso:S.cfg.tipo==='fidc'?'sem':'com',prazoReg:5,coob:true,dec:{},step:1,entry:'xml',alc:false,ovr:{},ovrSac:{},aprovSig:'',assin:{st:'nao',sig:''},info:{modalidade:'Duplicata mercantil',dataLib:HOJE,forma:'Pix',fav:cf?'conta:'+cf.id:'terceiro',favNome:'',favChave:'',proposta:'PR-'+String(S.seq.op+1+S.drafts.length).padStart(4,'0'),obs:''}};UI.opMode='detail';};
A.descartar=()=>{S.draft=null;UI.opMode='list';toast('Operação descartada');};
A.importar=()=>{const d=S.draft;d.tits=d.tits.concat(sample(d.cli).map(t=>({...t,origem:'xml'})));d.tits.forEach(t=>{t.incl=elegib(t,d).lvl!=='crit';});toast(d.tits.length+' NF-e importadas e pré-checadas');};
A.step=v=>{const d=S.draft,k=calc(d);if(+v>maxStep(d,k))return false;UI.sacView=null;d.step=+v;window.scrollTo(0,0);};
A.enviarAssin=()=>{const d=S.draft,k=calc(d);d.assin={st:'enviado',sig:sigOf(d,k)};toast('Documentos gerados e enviados para assinatura eletrônica');};
A.simAssin=()=>{S.draft.assin.st='assinado';toast('Todas as assinaturas concluídas');};
function ovRead(decId,motId){const dec=document.getElementById(decId).value,motivo=document.getElementById(motId).value.trim();return {dec,motivo};}
A.applyOv=tid=>{const d=S.draft;d.ovr=d.ovr||{};const {dec,motivo}=ovRead('ov-dec-'+tid,'ov-mot-'+tid);const t=d.tits.find(x=>x.id===tid);
  if(dec==='auto'){delete d.ovr[tid];UI.ovOpen=null;toast('Título NF '+t.nf+' volta para a decisão automática');return;}
  if(motivo.length<10){toast('Escreva o motivo da decisão (mínimo de 10 caracteres)');return false;}
  const h=hardBlock(t,d);if(dec==='ok'&&h.length){toast('Não pode ser liberado: '+h[0]);return false;}
  d.ovr[tid]={dec,motivo,d:HOJE,por:'Analista'};if(dec==='ok')t.incl=true;UI.ovOpen=null;toast('NF '+t.nf+(dec==='ok'?' liberada':' excluída')+' manualmente');};
A.applySacOv=sid=>{const d=S.draft;d.ovrSac=d.ovrSac||{};const {dec,motivo}=ovRead('ovs-dec','ovs-mot');const nm=sacOf(sid).nome;
  if(dec==='auto'){delete d.ovrSac[sid];toast(nm+' volta para a decisão automática');return;}
  if(motivo.length<10){toast('Escreva o motivo da decisão (mínimo de 10 caracteres)');return false;}
  d.ovrSac[sid]={dec,motivo,d:HOJE,por:'Analista'};if(dec==='ok')d.tits.filter(t=>t.sac===sid).forEach(t=>t.incl=true);toast(nm+(dec==='ok'?' liberado':' excluído')+' manualmente nesta operação');};
A.entry=v=>{S.draft.entry=v;};
A.ovOpen=v=>{UI.ovOpen=v||null;};
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='addMore')UI.addOpen=e.target.open;},true);
A.chkClose=()=>{UI.chkOpen=null;};
A.chkDet=tid=>{UI.chkOpen=UI.chkOpen===tid&&UI.chkMode==='det'?null:tid;UI.chkMode='det';};
A.chkOpenDisp=tid=>{UI.chkOpen=tid;UI.chkMode='disp';};
function chkApply(t,res){const c=t.chk;c.dispM='';c.sem=false;const s=sacOf(t.sac);if(!c.contato)c.contato=s.contato?.nome||'';
  if(res==='ok')Object.assign(c,{nf:'Sim',merc:'Sim',valor:'Sim',desac:'Não'});
  if(res==='div')Object.assign(c,{nf:'Sim',merc:'Sim',valor:'Não',desac:'Não'});
  if(res==='rec')Object.assign(c,{nf:'Sim',merc:'Não',valor:'Sim',desac:'Sim'});
  if(res==='sem')Object.assign(c,{sem:true,nf:'',merc:'',valor:'',desac:''});}
A.chkSet=v=>{const [tid,res]=v.split(':');const t=S.draft.tits.find(x=>x.id===tid);chkApply(t,res);if(res==='div'||res==='rec'){UI.chkOpen=tid;UI.chkMode='det';}else if(UI.chkOpen===tid)UI.chkOpen=null;};
A.chkAllOk=()=>{const d=S.draft,k=calc(d);k.rows.filter(r=>r.t.incl&&r.el.baseLvl!=='crit'&&r.el.rq.precisa&&r.el.cs==='pendente').forEach(r=>chkApply(r.t,'ok'));toast('Pendentes marcados como confirmados');};
A.chkDisp=tid=>{const t=S.draft.tits.find(x=>x.id===tid),m=document.getElementById('disp-mot-'+tid).value.trim();if(m.length<10){toast('Escreva o motivo da dispensa (mínimo de 10 caracteres)');return false;}chkApply(t,'none');t.chk.dispM=m;UI.chkOpen=null;toast('Checagem da NF '+t.nf+' dispensada');};

function parseDanfe(txt,d){const out=[],cc=dig(cliOf(d.cli).cnpj);const cn=(txt.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/g)||[]).map(dig);const dest=cn.find(x=>x!==cc)||'';const emit=cn.find(x=>x===cc);
  const nf=((txt.match(/N[º°o]\.?\s*:?\s*([\d.]{5,15})/i)||[])[1]||'').replace(/\D/g,'').slice(-6).padStart(6,'0');
  const chave=dig((txt.match(/((?:\d{4}\s?){11})/)||[])[1]||'');const cfop=(txt.match(/CFOP\s*:?\s*(\d{4})/i)||[])[1]||'5102';
  const em=brDate((txt.match(/EMISS[ÃA]O\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i)||[])[1]);const tot=brMoney((txt.match(/VALOR TOTAL DA NOTA\s*:?\s*(?:R\$\s*)?([\d.]+,\d{2})/i)||[])[1]);
  const dups=[...txt.matchAll(/(\d{3})\s+(\d{2}\/\d{2}\/\d{4})\s+(?:R\$\s*)?([\d.]+,\d{2})/g)];
  const base={nf,cnpj:dest?fmtCnpj(dest):'',cfop,chave,emissao:em||HOJE,emitErr:!emit};
  if(dups.length)dups.forEach((m,i)=>out.push({...base,nf:nf+(dups.length>1?'-'+(i+1):''),parc:(i+1)+'/'+dups.length,valor:m[3],venc:m[2]}));
  else out.push({...base,parc:'1/1',valor:tot?num(tot):'',venc:''});
  return {items:out,ok:!!(nf&&dest),emit:!!emit};}

  return {cmc7:m[1]+m[2]+m[3],valor:(seg.match(/([\d.]+,\d{2})/)||[])[1]||'',venc:(seg.match(/(\d{2}\/\d{2}\/\d{4})/)||[])[1]||'',cnpj:(seg.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/)||[])[0]||''};});}

A.importRet=()=>{

  const ls=txt.split(/\r?\n/).filter(l=>l[0]==='1');if(!ls.length){toast('Arquivo sem registros de detalhe');return false;}
  const out=[];let tp=0,tt=0;const seqR=(txt.split(/\r?\n/)[0].match(/(\d{7})\s*\d{6}$/)||[])[1]||'';

      out.push({doc,ocor:o.ocor,txt:dif>0?'Liquidado a menor':'Liquidado',lvl:dif>0?'warn':'ok'});}
    else if(o.ocor==='14'){ev(t,'Banco confirmou o novo vencimento');out.push({doc,ocor:o.ocor,txt:'Vencimento alterado',lvl:'ok'});}

    else out.push({doc,ocor:o.ocor,txt:'Ocorrência sem regra',lvl:'warn'});
  });
  tp=r2(tp);tt=r2(tt);
  if(tp>0)S.mov.push({id:nid('m'),d:HOJE,valor:tp,desc:'Crédito cobrança — retorno '+seqR.slice(-4),conc:false});
  if(tt>0){S.mov.push({id:nid('m'),d:HOJE,valor:-tt,desc:'Tarifas de cobrança — retorno '+seqR.slice(-4),conc:false});ctbAdd('Tarifas bancárias de cobrança',[{c:'4.1.1',dc:'D',v:tt},{c:'1.1.1',dc:'C',v:tt}]);}
  S.ret.filter(r=>r.tipo==='garantia'&&r.saldo>0&&!r.gatilho).forEach(r=>{if(S.titulos.filter(t=>t.op===r.op).every(t=>!aberto(t)))r.gatilho=true;});
  S.retornos.push({h,d:HOJE});S.lastRet={d:HOJE,rows:out};UI.retTxt='';
  toast(`Retorno importado: ${out.length} ocorrência(s) processada(s)`);

  if(b==='d.allin')v=v==='true';
  if(b==='incl'){const t=S.draft.tits.find(x=>x.id===el.dataset.id);t.incl=el.checked;}
  else if(b==='ret'){S.draft.ret[el.dataset.k]=el.checked;}
  else if(b==='ui.retTxt'){UI.retTxt=el.value;}
  else if(b==='chk'){const t=S.draft.tits.find(x=>x.id===el.dataset.id);t.chk[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;}
  else if(b==='gat'){S.cfg.gat[el.dataset.k][el.dataset.f]=v;}
  else if(b==='pdfi'){S.draft.pdf.items[+el.dataset.i][el.dataset.k]=el.value;}
  else setPath(b,v);
  if(b==='d.info.modalidade'&&S.draft)S.draft.entry=v==='Cheque'?'digitar':'xml';
  if(b==='d.alc'){if(el.checked){S.draft.aprovSig=sigOf(S.draft,calc(S.draft));}else S.draft.alc=false;}
  setTimeout(render,0);});
document.addEventListener('change',e=>{if(e.target.id!=='pdfFile')return;const f=e.target.files&&e.target.files[0];if(!f)return;const P=S.draft.pdf;P.msg={lvl:'info',txt:'Lendo o PDF…'};render();
  const r=new FileReader();r.onload=async()=>{try{const txt=await pdfText(new Uint8Array(r.result));pdfProcess(txt,f.name);}catch(err){P.items=[];P.msg={lvl:'crit',txt:'Não foi possível ler este PDF: '+(err&&err.message||'arquivo inválido')+'.'};}render();};r.readAsArrayBuffer(f);});
document.addEventListener('change',e=>{if(e.target.id!=='ofxFile')return;const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{UI.ofxTxt=String(r.result||'');UI.ofxRes=null;render();toast('Arquivo '+f.name+' carregado');};r.onerror=()=>toast('Não foi possível ler o arquivo');r.readAsText(f,'ISO-8859-1');});
document.addEventListener('input',e=>{if(e.target.id==='ofxTxt'){UI.ofxTxt=e.target.value;const btn=document.querySelector('[data-act="importOfx"]');if(btn)btn.disabled=!UI.ofxTxt.trim();}
  if(e.target.id==='retTxt'){UI.retTxt=e.target.value;const btn=document.querySelector('[data-act="importRet"]');if(btn)btn.disabled=!UI.retTxt.trim();}});
document.addEventListener('mousemove',e=>{const r=e.target.closest&&e.target.closest('[data-fx]');const tip=document.getElementById('fxTip'),cr=document.getElementById('fxCross');if(!tip)return;if(!r){tip.hidden=true;if(cr)cr.setAttribute('visibility','hidden');return;}
  const i=+r.dataset.fx,f=UI._fluxo[i],wrap=document.getElementById('fxWrap').getBoundingClientRect(),rb=r.getBoundingClientRect();
  tip.innerHTML=`<b>${fd(f.d)}</b><br>Saldo ${brl(f.saldo)}${f.ent?`<br>Entradas ${brl(f.ent)}`:''}${f.sai?`<br>Saídas ${brl(f.sai)}`:''}`;tip.hidden=false;
  tip.style.left=Math.min(Math.max(rb.left+rb.width/2-wrap.left,70),wrap.width-70)+'px';tip.style.top='40px';
  const x=r.getAttribute('x')*1+r.getAttribute('width')/2;cr.setAttribute('x1',x);cr.setAttribute('x2',x);cr.setAttribute('visibility','visible');});
render();
</script>
