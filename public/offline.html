<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>STRATO · Sem conexão</title>
    <style>
      body {
        margin: 0;
        background: #f7f7f7;
        color: #171717;
        font:
          17px system-ui,
          sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      main {
        max-width: 32rem;
        margin: 2rem;
        padding: 2.5rem;
        background: white;
        border: 1px solid #ddd;
        border-radius: 1rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 0.5rem;
        background: #171717;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>STRATO</strong>
      <h1>Sem conexão com o servidor</h1>
      <p>
        Reconecte à internet para consultar o painel e continuar o trabalho. Dados de clientes, operações e financeiro
        não ficam disponíveis offline.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
